  <text x="28" y="108" font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#5b6272">Turns your phone into a low-latency air mouse, presenter remote, inertia trackball and</text><text x="28" y="130" font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#5b6272">precision dial for your laptop. Encrypted end to end, paired devices only, no cloud.</text>
