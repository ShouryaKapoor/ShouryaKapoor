      </circle>
      <circle cx="640" cy="380" r="110" fill="#f472b6" opacity=".7">
        <animate attributeName="cx" values="640;720;640" dur="16s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="339" rx="21.5" fill="none" stroke="#1f2430"/>

