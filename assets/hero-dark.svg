    </rect></clipPath>
    <text x="94" y="246" clip-path="url(#c1)" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="22" fill="#eef0f5">MSc Intelligent Systems @ Trinity College Dublin</text>
    <rect x="94" y="226" width="11" height="26" rx="1.5" fill="#22d3ee" opacity="0">
      <animate attributeName="x" values="94;730;730;94;94" keyTimes="0;0.1;0.27;0.31;1" dur="12s" begin="4s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1;0 0 1 1;.4 0 .6 1;0 0 1 1"/>
      <animate attributeName="opacity" values="1;0" keyTimes="0;0.333" dur="12s" begin="4s" repeatCount="indefinite" calcMode="discrete"/>
