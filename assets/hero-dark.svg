    <clipPath id="c0"><rect x="94" y="222" height="34" width="0">
      <animate attributeName="width" values="0;490;490;0;0" keyTimes="0;0.1;0.27;0.31;1" dur="12s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1;0 0 1 1;.4 0 .6 1;0 0 1 1"/>
    </rect></clipPath>
    <text x="94" y="246" clip-path="url(#c0)" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="22" fill="#eef0f5">building AI agents that actually ship</text>
    <rect x="94" y="226" width="11" height="26" rx="1.5" fill="#22d3ee" opacity="0">
